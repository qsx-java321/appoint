Unauthorized:
  description: 未登录或 Token 无效。
  content:
    application/json:
      schema:
        $ref: './schemas.yaml#/ErrorResult'
      example:
        code: 2001
        message: 请先登录或重新登录
        data: null

ValidationError:
  description: 请求参数不合法。
  content:
