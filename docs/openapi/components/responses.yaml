  content:
    application/json:
      schema:
        $ref: './schemas.yaml#/ErrorResult'
      example:
        code: 4402
        message: 该资源仍被下级资源引用，不能删除
        data: null

DoctorAccountAlreadyBound:
  description: 医生档案或账号已绑定，不支持换绑。
  content:
    application/json:
      schema:
        $ref: './schemas.yaml#/ErrorResult'
      example:
        code: 4501
        message: 医生档案或账号已绑定，不支持换绑
        data: null

InternalError:
  description: 服务暂时不可用。
  content:
    application/json:
      schema:
        $ref: './schemas.yaml#/ErrorResult'
      example:
        code: 1002
        message: 服务暂时不可用
        data: null
