openapi: 3.0.3

info:
  title: 医院预约系统 API
  version: 1.0.0
  license:
    name: UNLICENSED
  description: |
    医院预约系统 API 的 OpenAPI 契约，覆盖账号、就诊人、医疗目录、预约支付、签到接诊、
    消息中心、本地环境和 test 调时。

    通用约定、业务规则和错误码见 [REST API 文档](../api.md)。
    当前契约覆盖：

    - Auth：注册验证码、验码、注册、登录
    - User：当前用户、上传头像、删除头像、读取头像
    - Patient：就诊人列表、详情、新增、修改、启停
    - Catalog：医院、科室、医生、场次查询
    - AdminCatalog：医院、科室、医生档案管理
    - BookingSettings：统一预约设置
    - DoctorAccount：医生账号查询与首次绑定
    - Appointment：预约令牌、创建、详情、列表、支付、取消
    - Visit：到院签到、医生场次、开始/完成接诊
    - Notification：消息中心列表与详情
    - LocalEnvironment：本地环境状态探测
    - TestClock：test 环境业务时间查询、设置和恢复

    本地环境通过 `X-Appoint-Environment` 标识 demo/dev/test；直接调用后端时可省略。
    业务 API 使用统一响应结构 `{ code, message, data }`，错误时 `data=null`。

servers:
  - url: http://127.0.0.1:8080/api/v1
    description: 本地后端（demo/dev/test 共用 8080，按启动的 profile 切换）

tags:
  - name: Auth
    description: 注册与登录
  - name: User
    description: 当前用户与头像
  - name: Patient
    description: 就诊人管理
  - name: Catalog
    description: 登录用户查询医院、科室、医生和场次
  - name: AdminCatalog
    description: 管理员维护医院、科室和医生档案
  - name: BookingSettings
    description: 管理员统一预约设置
  - name: DoctorAccount
    description: 管理员查询和首次绑定医生账号
  - name: Appointment
    description: 预约令牌、创建、详情、列表、支付和取消
  - name: Visit
    description: 到院签到、医生场次和接诊动作
  - name: Notification
    description: 消息中心
  - name: LocalEnvironment
    description: 本地环境状态探测
  - name: TestClock
    description: test 环境业务时间调时

x-tagGroups:
  - name: 账号与用户
    tags: [Auth, User]
  - name: 就诊人
    tags: [Patient]
  - name: 医疗目录
    tags: [Catalog, AdminCatalog, BookingSettings, DoctorAccount]
  - name: 预约与支付
    tags: [Appointment]
  - name: 到院与接诊
    tags: [Visit]
  - name: 消息中心
    tags: [Notification]
  - name: 本地运维
    tags: [LocalEnvironment, TestClock]

security:
  - bearerAuth: []

paths:
  /auth/register/code:
    $ref: './paths/auth.yaml#/registerCode'
  /auth/register/verify:
    $ref: './paths/auth.yaml#/verifyRegistrationCode'
  /auth/register:
    $ref: './paths/auth.yaml#/register'
  /auth/login:
    $ref: './paths/auth.yaml#/login'
  /users/me:
    $ref: './paths/users.yaml#/currentUser'
  /users/me/avatar:
    $ref: './paths/users.yaml#/meAvatar'
  /users/{id}/avatar:
    $ref: './paths/users.yaml#/getAvatar'
  /patients:
    $ref: './paths/patients.yaml#/patients'
  /patients/{id}:
    $ref: './paths/patients.yaml#/patient'
  /patients/{id}/status:
    $ref: './paths/patients.yaml#/patientStatus'
  /hospitals:
    $ref: './paths/catalog.yaml#/hospitals'
  /hospitals/{hospitalId}/departments:
    $ref: './paths/catalog.yaml#/hospitalDepartments'
  /departments/{departmentId}/doctors:
    $ref: './paths/catalog.yaml#/departmentDoctors'
  /doctors/{doctorId}/schedules:
    $ref: './paths/catalog.yaml#/doctorSchedules'
  /admin/hospitals:
    $ref: './paths/admin-catalog.yaml#/adminHospitals'
  /admin/hospitals/{hospitalId}:
    $ref: './paths/admin-catalog.yaml#/adminHospital'
  /admin/hospitals/{hospitalId}/departments:
    $ref: './paths/admin-catalog.yaml#/adminHospitalDepartments'
  /admin/departments/{departmentId}:
    $ref: './paths/admin-catalog.yaml#/adminDepartment'
  /admin/departments/{departmentId}/doctors:
    $ref: './paths/admin-catalog.yaml#/adminDepartmentDoctors'
  /admin/doctors/{doctorId}:
    $ref: './paths/admin-catalog.yaml#/adminDoctor'
  /admin/booking-settings:
    $ref: './paths/booking-settings.yaml#/adminBookingSettings'
  /admin/doctor-accounts:
    $ref: './paths/doctor-accounts.yaml#/adminDoctorAccounts'
  /admin/doctors/{doctorId}/account:
    $ref: './paths/doctor-accounts.yaml#/adminDoctorAccount'
  /appointments/token:
    $ref: './paths/appointments.yaml#/bookingToken'
  /appointments:
    $ref: './paths/appointments.yaml#/appointments'
  /appointments/my:
    $ref: './paths/appointments.yaml#/myAppointments'
  /appointments/{id}:
    $ref: './paths/appointments.yaml#/appointment'
  /appointments/{id}/pay:
    $ref: './paths/appointments.yaml#/payAppointment'
  /appointments/{id}/cancel:
    $ref: './paths/appointments.yaml#/cancelAppointment'
  /appointments/{id}/check-in:
    $ref: './paths/visits.yaml#/checkIn'
  /doctor/sessions:
    $ref: './paths/visits.yaml#/doctorSessions'
  /doctor/appointments:
    $ref: './paths/visits.yaml#/doctorAppointments'
  /doctor/appointments/{id}:
    $ref: './paths/visits.yaml#/doctorAppointment'
  /doctor/appointments/{id}/start-visit:
    $ref: './paths/visits.yaml#/startVisit'
  /doctor/appointments/{id}/complete-visit:
    $ref: './paths/visits.yaml#/completeVisit'
  /notifications:
    $ref: './paths/notifications.yaml#/notifications'
  /notifications/{id}:
    $ref: './paths/notifications.yaml#/notification'
  /local-environment:
    $ref: './paths/local-environment.yaml#/localEnvironmentStatus'
  /test-control/clock:
    $ref: './paths/test-clock.yaml#/testClock'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "登录接口返回的 accessToken，放在 `Authorization: Bearer <token>`。"
