myAppointments:
  get:
    tags: [Appointment]
    operationId: listMyAppointments
    summary: 查询本人预约列表
    description: 不接收其他账号 ID；默认按就诊日期、场次开始时间和预约 ID 降序。`order=ASC` 时改为升序。
    parameters:
      - name: order
        in: query
        required: false
        description: 排序方向，默认 DESC。
        schema:
          type: string
          enum: [ASC, DESC]
          default: DESC
          example: DESC
    responses:
      '200':
        description: 本人预约列表
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/AppointmentListResult'
            example:
              code: 0
              message: success
              data: []
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '500':
        $ref: '../components/responses.yaml#/InternalError'

payAppointment:
  parameters:
    - $ref: '../components/parameters.yaml#/AppointmentId'
  post:
    tags: [Appointment]
    operationId: payAppointment
    summary: 模拟支付
    description: |
      只允许待支付、支付单未付且未超过最晚支付时刻的预约。
      重复支付已确认订单返回原支付时间和就诊序号；已过期返回 409 / 4004；其他不允许的状态返回 409 / 4003。
