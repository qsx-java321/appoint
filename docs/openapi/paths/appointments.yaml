                status: CONFIRMED
                visitNumber: 1
                createdAt: 2026-11-14T09:00:00
                paymentOrderId: "501"
                paymentStatus: PAID
                workflowStatus: CONFIRMED
                amount: 10.00
                currency: CNY
                paidAt: 2026-11-14T09:05:00
                paymentExpiresAt: 2026-11-14T09:15:00
                closedAt: null
                serverTime: 2026-11-14T09:05:00
                paymentExpired: false
                canPay: false
                canCancel: false
                patient:
                  id: "201"
                  name: 张小明
                  documentType: RESIDENT_ID_CARD
                  documentNoMasked: 1101**********002X
                  contactPhone: "13800138000"
                  contactEmail: patient@example.com
                doctor:
                  id: "101"
                  doctorNo: DOC000101
                  name: 李明
                  title: 主任医师
                  department:
                    id: "11"
                    name: 心内科
                  hospital:
                    id: "1"
                    name: 市中心医院
                    address: 人民路 100 号
                sessionType: MORNING_FIRST
                visit:
                  status: NOT_CHECKED_IN
                  checkedInAt: null
                  startedAt: null
                  completedAt: null
