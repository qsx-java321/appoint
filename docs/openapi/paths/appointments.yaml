cancelAppointment:
  parameters:
    - $ref: '../components/parameters.yaml#/AppointmentId'
  post:
    tags: [Appointment]
    operationId: cancelAppointment
    summary: 取消预约
    description: |
      只允许关闭未支付的待支付预约。已取消或已过期的预约重复取消返回当前详情。
      待支付预约已超时但尚未被后台关单时，取消会按过期关闭并释放名额。
      已确认预约不允许取消，返回 409 / 4003。
      用户取消后 `workflowStatus` 和 `visit` 为 null；下方示例省略这两个可空字段。
    responses:
      '200':
        description: 取消后的预约详情
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/AppointmentResult'
            example:
              code: 0
              message: success
              data:
                id: "301"
                appointmentNo: AP6f8b7c1e3f5d4a8e9b2c1d4e6f8a0c2b
                scheduleId: "401"
                appointmentDate: 2026-11-14
                startTime: "08:00:00"
                endTime: "10:00:00"
                status: CANCELLED
                visitNumber: null
                createdAt: 2026-11-14T09:00:00
                paymentOrderId: "501"
                paymentStatus: CLOSED
                amount: 10.00
                currency: CNY
                paidAt: null
                paymentExpiresAt: 2026-11-14T09:15:00
                closedAt: 2026-11-14T09:05:00
                serverTime: 2026-11-14T09:05:00
                paymentExpired: false
                canPay: false
                canCancel: false
                patient:
                  id: "201"
                  name: 张小明
                  documentType: RESIDENT_ID_CARD
                  documentNoMasked: 1101**********002X
                  contactPhone: "13800138000"
                  contactEmail: patient@example.com
                doctor:
                  id: "101"
                  doctorNo: DOC000101
                  name: 李明
                  title: 主任医师
                  department:
                    id: "11"
                    name: 心内科
                  hospital:
                    id: "1"
                    name: 市中心医院
                    address: 人民路 100 号
                sessionType: MORNING_FIRST
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        $ref: '../components/responses.yaml#/OrderStateError'
      '500':
        $ref: '../components/responses.yaml#/InternalError'
