          example: false
        checkInOpensAt:
          $ref: '#/components/schemas/LocalDateTime'
        checkInClosesAt:
          $ref: '#/components/schemas/LocalDateTime'
    Appointment:
      type: object
      description: 本人预约详情及列表项，包含创建时的凭证快照和当前支付/就诊进度。
      required:
        - id
        - appointmentNo
        - scheduleId
        - appointmentDate
        - startTime
        - endTime
        - status
        - visitNumber
        - createdAt
        - paymentOrderId
        - paymentStatus
        - amount
        - currency
        - paidAt
        - paymentExpiresAt
        - closedAt
        - serverTime
        - paymentExpired
        - canPay
        - canCancel
        - patient
        - doctor
        - sessionType
      properties:
        id:
          type: string
          example: '301'
        appointmentNo:
          type: string
          example: AP6f8b7c1e3f5d4a8e9b2c1d4e6f8a0c2b
        scheduleId:
          type: string
          example: '401'
        appointmentDate:
          $ref: '#/components/schemas/LocalDate'
        startTime:
          $ref: '#/components/schemas/LocalTime'
        endTime:
          $ref: '#/components/schemas/LocalTime'
