openapi: 3.0.3
info:
  title: 医院预约系统 API
  version: 1.0.0
  license:
    name: UNLICENSED
  description: |
    认证、用户与头像接口的 OpenAPI 契约试点。

    通用约定、业务规则和错误码见 [REST API 文档](../api.md)。
    当前契约覆盖：

    - Auth：注册验证码、验码、注册、登录
    - User：当前用户、上传头像、删除头像、读取头像

    本地环境通过 `X-Appoint-Environment` 标识 demo/dev/test；直接调用后端时可省略。
    业务 API 使用统一响应结构 `{ code, message, data }`，错误时 `data=null`。
servers:
  - url: http://127.0.0.1:8080/api/v1
    description: 本地后端（demo/dev/test 共用 8080，按启动的 profile 切换）
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: 注册与登录
  - name: User
    description: 当前用户与头像
paths:
  /auth/register/code:
    post:
      tags:
        - Auth
      operationId: sendRegistrationCode
      summary: 发送注册验证码
      description: |
        向指定邮箱发送六位数字验证码，验证码写入 Redis 并通过 Mailpit 投递。
        邮箱已注册时返回 409 / 3001；验证码默认有效期五分钟，重发覆盖旧码。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendRegistrationCodeRequest'
            example:
              email: new-user@example.local
      responses:
        '200':
          description: 验证码已发送
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationCodeResult'
              example:
                code: 0
                message: success
                data:
                  expiresIn: 300
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/EmailExists'
  /auth/register/verify:
    post:
      tags:
        - Auth
      operationId: verifyRegistrationCode
      summary: 校验注册验证码
      description: |
        校验验证码并签发一次性注册票据。验证码错误返回 400 / 3003；
        验证码不存在或已过期返回 400 / 3004。验码成功后旧验证码被消费。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRegistrationCodeRequest'
            example:
              email: new-user@example.local
              code: '012345'
      responses:
        '200':
          description: 验证码正确，返回注册票据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupTicketResult'
              example:
                code: 0
                message: success
                data:
                  signupTicket: 6f8b7c1e-3f5d-4a8e-9b2c-1d4e6f8a0c2b
                  expiresIn: 300
        '400':
          description: 验证码错误或已过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              examples:
                invalid:
                  value:
                    code: 3003
                    message: 验证码错误
                    data: null
                expired:
                  value:
                    code: 3004
                    message: 验证码已过期，请重新获取
                    data: null
                validation:
                  value:
                    code: 1001
                    message: 请求参数不合法
                    data: null
  /auth/register:
    post:
      tags:
        - Auth
      operationId: register
      summary: 注册账号
      description: |
        消费一次性注册票据并创建普通用户账号，初始角色为 USER。
        注册票据无效、过期、已消费或邮箱不匹配返回 400 / 3005；邮箱已注册返回 409 / 3001。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: new-user@example.local
              password: <PASSWORD>
              signupTicket: 6f8b7c1e-3f5d-4a8e-9b2c-1d4e6f8a0c2b
      responses:
        '201':
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResult'
              example:
                code: 0
                message: success
                data:
                  id: '2'
                  email: new-user@example.local
                  roles:
                    - USER
                  avatarUrl: null
        '400':
          description: 注册票据无效或请求参数不合法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              examples:
                ticketInvalid:
                  value:
                    code: 3005
                    message: 注册凭证无效，请重新验证邮箱
                    data: null
                validation:
                  value:
                    code: 1001
                    message: 请求参数不合法
                    data: null
        '409':
          $ref: '#/components/responses/EmailExists'
  /auth/login:
    post:
      tags:
        - Auth
      operationId: login
      summary: 登录
      description: |
        使用邮箱和密码登录，返回 JWT 与当前用户信息。
        后续请求使用 `Authorization: Bearer <accessToken>`；角色变更后需重新登录。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: demo-user@example.local
              password: <LOCAL_SEED_PASSWORD>
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
              example:
                code: 0
                message: success
                data:
                  accessToken: <JWT>
                  tokenType: Bearer
                  expiresIn: 7200
                  user:
                    id: '1'
                    email: demo-user@example.local
                    roles:
                      - USER
                    avatarUrl: null
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/LoginFailed'
  /users/me:
    get:
      tags:
        - User
      operationId: getCurrentUser
      summary: 查询当前用户
      description: 返回当前登录用户的基本信息、角色和头像地址。
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResult'
              example:
                code: 0
                message: success
                data:
                  id: '1'
                  email: demo-user@example.local
                  roles:
                    - USER
                  avatarUrl: /api/v1/users/1/avatar?v=0ffcbffe-d6d1-4f4c-aa86-9faf4acc911e.png
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/me/avatar:
    put:
      tags:
        - User
      operationId: uploadAvatar
      summary: 上传或替换当前头像
      description: |
        只操作当前登录账号。服务端按文件头判定 JPEG/PNG/WebP，并校验大小不超过 2 MB、
        JPEG/PNG 宽高不超过 4096 像素。成功后返回新的 `avatarUrl`，替换头像会生成新的版本号。
        数据库更新失败时删除新写入的对象；旧对象在更新成功后尽力删除。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AvatarUploadRequest'
      responses:
        '200':
          description: 头像已更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResult'
              example:
                code: 0
                message: success
                data:
                  id: '1'
                  email: demo-user@example.local
                  roles:
                    - USER
                  avatarUrl: /api/v1/users/1/avatar?v=8d9c1a2b-4e6f-4a1b-9c3d-2f5e7a9b1c3d.png
        '400':
          description: 头像格式、大小、尺寸或 multipart 参数不合法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              examples:
                avatarInvalid:
                  value:
                    code: 3101
                    message: 头像必须是 2 MB 以内的 JPEG、PNG 或 WebP 图片
                    data: null
                validation:
                  value:
                    code: 1001
                    message: 请求参数不合法
                    data: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/AvatarStorageUnavailable'
    delete:
      tags:
        - User
      operationId: deleteAvatar
      summary: 删除当前头像
      description: 清空当前头像并尽力删除对象存储中的旧对象。重复删除仍返回 200，`avatarUrl` 保持 null。
      responses:
        '200':
          description: 头像已删除
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResult'
              example:
                code: 0
                message: success
                data:
                  id: '1'
                  email: demo-user@example.local
                  roles:
                    - USER
                  avatarUrl: null
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/{id}/avatar:
    get:
      tags:
        - User
      operationId: getUserAvatar
      summary: 读取用户头像图片
      description: |
        按用户 ID 返回当前头像图片，无需登录。响应带长期缓存头和 ETag；
        `If-None-Match` 匹配时返回 304。用户没有头像、头像已删除或对象不存在时返回 404。
      security: []
      parameters:
        - name: id
          in: path
          required: true
          description: 用户 ID。
          schema:
            type: integer
            format: int64
            example: 1
        - name: v
          in: query
          required: false
          description: 缓存版本号，通常为头像对象文件名。替换头像后变化。
          schema:
            type: string
            example: 0ffcbffe-d6d1-4f4c-aa86-9faf4acc911e.png
        - name: If-None-Match
          in: header
          required: false
          description: 浏览器缓存校验值，与 ETag 匹配时返回 304。
          schema:
            type: string
            example: '"0ffcbffe-d6d1-4f4c-aa86-9faf4acc911e.png"'
      responses:
        '200':
          description: 头像图片
          headers:
            ETag:
              description: 当前头像版本，值为对象文件名。
              schema:
                type: string
                example: '"0ffcbffe-d6d1-4f4c-aa86-9faf4acc911e.png"'
            Cache-Control:
              description: 长期公共缓存。
              schema:
                type: string
                example: max-age=31536000, public, immutable
            X-Content-Type-Options:
              description: 防止浏览器嗅探内容类型。
              schema:
                type: string
                example: nosniff
          content:
            image/png:
              schema:
                $ref: '#/components/schemas/AvatarImage'
            image/jpeg:
              schema:
                $ref: '#/components/schemas/AvatarImage'
            image/webp:
              schema:
                $ref: '#/components/schemas/AvatarImage'
        '304':
          description: 头像未变化
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/AvatarStorageUnavailable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: '登录接口返回的 accessToken，放在 `Authorization: Bearer <token>`。'
  schemas:
    SendRegistrationCodeRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: new-user@example.local
    RegistrationCodeResult:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: success
        data:
          type: object
          required:
            - expiresIn
          properties:
            expiresIn:
              type: integer
              description: 验证码有效期，单位秒。
              example: 300
    ErrorResult:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          type: integer
          description: 业务错误码，非 0。
          example: 3101
        message:
          type: string
          example: 头像必须是 2 MB 以内的 JPEG、PNG 或 WebP 图片
        data:
          type: object
          nullable: true
          example: null
    VerifyRegistrationCodeRequest:
      type: object
      required:
        - email
        - code
      properties:
        email:
          type: string
          format: email
          example: new-user@example.local
        code:
          type: string
          description: 六位数字验证码，保留前导零。
          pattern: ^[0-9]{6}$
          example: '012345'
    SignupTicketResult:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: success
        data:
          type: object
          required:
            - signupTicket
            - expiresIn
          properties:
            signupTicket:
              type: string
              description: 一次性注册票据，提交注册时消费。
              example: 6f8b7c1e-3f5d-4a8e-9b2c-1d4e6f8a0c2b
            expiresIn:
              type: integer
              example: 300
    RegisterRequest:
      type: object
      required:
        - email
        - password
        - signupTicket
      properties:
        email:
          type: string
          format: email
          example: new-user@example.local
        password:
          type: string
          minLength: 8
          maxLength: 64
          example: <PASSWORD>
        signupTicket:
          type: string
          example: 6f8b7c1e-3f5d-4a8e-9b2c-1d4e6f8a0c2b
    User:
      type: object
      description: 当前登录用户或注册用户。
      required:
        - id
        - email
        - roles
        - avatarUrl
      properties:
        id:
          type: string
          description: 用户 ID。服务端 Long 统一序列化为字符串，避免前端精度丢失。
          example: '1'
        email:
          type: string
          format: email
          example: demo-user@example.local
        roles:
          type: array
          description: 当前数据库角色码。
          items:
            type: string
            enum:
              - USER
              - DOCTOR
              - ADMIN
          example:
            - USER
        avatarUrl:
          type: string
          nullable: true
          description: 当前头像相对地址；无头像时为 null。替换头像后版本号会变化。
          example: /api/v1/users/1/avatar?v=0ffcbffe-d6d1-4f4c-aa86-9faf4acc911e.png
    UserResult:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: success
        data:
          $ref: '#/components/schemas/User'
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: demo-user@example.local
        password:
          type: string
          minLength: 8
          maxLength: 64
          example: <LOCAL_SEED_PASSWORD>
    LoginResult:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: success
        data:
          type: object
          required:
            - accessToken
            - tokenType
            - expiresIn
            - user
          properties:
            accessToken:
              type: string
              example: <JWT>
            tokenType:
              type: string
              enum:
                - Bearer
              example: Bearer
            expiresIn:
              type: integer
              description: Token 有效期，单位秒。
              example: 7200
            user:
              $ref: '#/components/schemas/User'
    AvatarUploadRequest:
      type: object
      required:
        - file
      properties:
        file:
          type: string
          format: binary
          description: JPEG、PNG 或 WebP 图片，不超过 2 MB。服务端按文件头判定格式。
    AvatarImage:
      type: string
      format: binary
      description: 头像图片字节。
  responses:
    ValidationError:
      description: 请求参数不合法。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
          example:
            code: 1001
            message: 请求参数不合法
            data: null
    EmailExists:
      description: 邮箱已注册。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
          example:
            code: 3001
            message: 邮箱已注册
            data: null
    LoginFailed:
      description: 邮箱或密码错误。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
          example:
            code: 2003
            message: 邮箱或密码错误
            data: null
    Unauthorized:
      description: 未登录或 Token 无效。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
          example:
            code: 2001
            message: 请先登录或重新登录
            data: null
    AvatarStorageUnavailable:
      description: 头像对象存储暂时不可用。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
          example:
            code: 3102
            message: 头像存储暂时不可用，请稍后重试
            data: null
    NotFound:
      description: 请求的资源不存在。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
          example:
            code: 4001
            message: 请求的资源不存在
            data: null
x-tagGroups:
  - name: 账号与用户
    tags:
      - Auth
      - User
