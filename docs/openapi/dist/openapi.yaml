          type: string
          enum:
            - PENDING_PAYMENT
            - CONFIRMED
            - CANCELLED
            - EXPIRED
          example: CONFIRMED
        visitNumber:
          type: integer
          nullable: true
          example: 1
        createdAt:
          $ref: '#/components/schemas/LocalDateTime'
        paymentOrderId:
          type: string
          example: '501'
        paymentStatus:
          type: string
          enum:
            - UNPAID
            - PAID
            - CLOSED
          example: PAID
        workflowStatus:
          type: string
          nullable: true
          description: 预约与支付的组合展示状态；用户取消后为 null。
          enum:
            - WAITING_FOR_PAYMENT
            - CONFIRMED
            - EXPIRED
          example: CONFIRMED
        amount:
          type: number
          description: 预约详情中的金额为 JSON 数值；创建回执中的 amount 为字符串。
          example: 10
        currency:
          type: string
          enum:
            - CNY
          example: CNY
        paidAt:
          $ref: '#/components/schemas/NullableLocalDateTime'
        paymentExpiresAt:
          $ref: '#/components/schemas/NullableLocalDateTime'
        closedAt:
          $ref: '#/components/schemas/NullableLocalDateTime'
        serverTime:
          $ref: '#/components/schemas/LocalDateTime'
        paymentExpired:
