  /local-environment:
    get:
      tags:
        - LocalEnvironment
      operationId: getLocalEnvironmentStatus
      summary: 探测本地环境状态
      description: |
        常驻环境提供的免登录探测接口。后端已能接受流量时返回 200；已启动但尚未就绪时返回 503。
        响应直接返回状态对象，不使用统一 `{ code, message, data }` 包装，并设置 `Cache-Control: no-store`。
        由本地脚本启动时 `launchId` 为当次启动标识；单独启动后端时通常为 `null`。
      security: []
      responses:
        '200':
          description: 环境已就绪
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalEnvironmentStatus'
              example:
                profile: demo
                ready: true
                launchId: 9f8b7c1e3f5d4a8e9b2c1d4e6f8a0c2b
        '409':
          description: 请求头中的环境标识与当前 profile 不一致
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                code: 1003
                message: 运行环境已切换，请刷新页面
                data: null
        '503':
          description: 环境尚未就绪
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalEnvironmentStatus'
              example:
                profile: demo
                ready: false
                launchId: 9f8b7c1e3f5d4a8e9b2c1d4e6f8a0c2b
  /test-control/clock:
    get:
      tags:
        - TestClock
      operationId: getBusinessClock
      summary: 查询业务时间
      description: |
        仅在 test 环境存在，需要 ADMIN 角色。返回当前业务时间和模式：
        `realtime` 为实时，`adjusted` 为已调时。其他环境该接口不存在。
      responses:
        '200':
          description: 当前业务时间
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessClockResult'
              example:
                code: 0
                message: success
                data:
                  businessTime: '2026-11-20T07:20:00+08:00'
                  mode: adjusted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - TestClock
      operationId: setBusinessClock
      summary: 设置业务时间
      description: |
        仅在 test 环境存在，需要 ADMIN 角色。设置后业务时钟继续走秒。
        调时影响下单、支付、过期扫描和签到；Redis 有效期和 JWT 仍使用真实时间。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetBusinessClockRequest'
            example:
              instant: '2026-11-20T07:20:00+08:00'
      responses:
        '200':
          description: 设置后的业务时间
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessClockResult'
              example:
                code: 0
                message: success
                data:
                  businessTime: '2026-11-20T07:20:00+08:00'
                  mode: adjusted
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - TestClock
      operationId: resetBusinessClock
      summary: 恢复实时业务时间
      description: |
        仅在 test 环境存在，需要 ADMIN 角色。恢复实时后，已提交的操作结果不回滚；
        后端重启或执行本接口都会恢复实时。
      responses:
        '200':
          description: 已恢复实时
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessClockResult'
              example:
                code: 0
                message: success
                data:
                  businessTime: '2026-11-20T09:30:00+08:00'
                  mode: realtime
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: '登录接口返回的 accessToken，放在 `Authorization: Bearer <token>`。'
  schemas:
    SendRegistrationCodeRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: new-user@example.local
    RegistrationCodeResult:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: success
        data:
          type: object
          required:
            - expiresIn
          properties:
            expiresIn:
              type: integer
              description: 验证码有效期，单位秒。
              example: 300
    ErrorResult:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          type: integer
          description: 业务错误码，非 0。
          example: 3101
        message:
          type: string
          example: 头像必须是 2 MB 以内的 JPEG、PNG 或 WebP 图片
        data:
          type: object
          nullable: true
          example: null
    VerifyRegistrationCodeRequest:
      type: object
      required:
        - email
        - code
      properties:
        email:
          type: string
          format: email
          example: new-user@example.local
        code:
          type: string
          description: 六位数字验证码，保留前导零。
          pattern: ^[0-9]{6}$
          example: '012345'
    SignupTicketResult:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: success
        data:
          type: object
          required:
            - signupTicket
            - expiresIn
          properties:
            signupTicket:
              type: string
              description: 一次性注册票据，提交注册时消费。
              example: 6f8b7c1e-3f5d-4a8e-9b2c-1d4e6f8a0c2b
            expiresIn:
              type: integer
              example: 300
    RegisterRequest:
      type: object
      required:
        - email
        - password
        - signupTicket
      properties:
        email:
          type: string
          format: email
          example: new-user@example.local
        password:
          type: string
          minLength: 8
          maxLength: 64
          example: <PASSWORD>
        signupTicket:
          type: string
          example: 6f8b7c1e-3f5d-4a8e-9b2c-1d4e6f8a0c2b
    User:
      type: object
      description: 当前登录用户或注册用户。
      required:
        - id
        - email
        - roles
        - avatarUrl
      properties:
        id:
          type: string
          description: 用户 ID。服务端 Long 统一序列化为字符串，避免前端精度丢失。
          example: '1'
        email:
          type: string
          format: email
          example: demo-user@example.local
        roles:
          type: array
          description: 当前数据库角色码。
          items:
            type: string
            enum:
              - USER
              - DOCTOR
              - ADMIN
          example:
            - USER
        avatarUrl:
          type: string
          nullable: true
          description: 当前头像相对地址；无头像时为 null。替换头像后版本号会变化。
          example: /api/v1/users/1/avatar?v=0ffcbffe-d6d1-4f4c-aa86-9faf4acc911e.png
    UserResult:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: success
        data:
          $ref: '#/components/schemas/User'
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: demo-user@example.local
        password:
          type: string
          minLength: 8
          maxLength: 64
          example: <LOCAL_SEED_PASSWORD>
    LoginResult:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: success
        data:
          type: object
          required:
            - accessToken
            - tokenType
            - expiresIn
            - user
          properties:
            accessToken:
              type: string
              example: <JWT>
            tokenType:
              type: string
              enum:
                - Bearer
              example: Bearer
            expiresIn:
              type: integer
              description: Token 有效期，单位秒。
              example: 7200
            user:
              $ref: '#/components/schemas/User'
    AvatarUploadRequest:
      type: object
      required:
        - file
      properties:
        file:
          type: string
          format: binary
          description: JPEG、PNG 或 WebP 图片，不超过 2 MB。服务端按文件头判定格式。
    AvatarImage:
      type: string
      format: binary
      description: 头像图片字节。
    LocalDateTime:
      type: string
      description: 业务本地时间，Asia/Shanghai，格式 yyyy-MM-ddTHH:mm:ss，不带时区偏移。
      example: '2026-11-14T09:00:00'
    Patient:
      type: object
      description: 就诊人资料。证件号只返回脱敏值。
      required:
        - id
        - name
        - documentType
        - documentNoMasked
        - contactPhone
        - contactEmail
        - enabled
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          example: '201'
        name:
          type: string
          maxLength: 64
          example: 张小明
        documentType:
          type: string
          enum:
            - RESIDENT_ID_CARD
          example: RESIDENT_ID_CARD
        documentNoMasked:
          type: string
          description: 脱敏证件号，不返回原文。
          example: 1101**********002X
        contactPhone:
          type: string
          example: '13800138000'
        contactEmail:
          type: string
          format: email
          example: patient@example.com
        enabled:
          type: boolean
          example: true
        createdAt:
          $ref: '#/components/schemas/LocalDateTime'
        updatedAt:
          $ref: '#/components/schemas/LocalDateTime'
    PatientListResult:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: success
        data:
          type: array
          items:
            $ref: '#/components/schemas/Patient'
    PatientCreateRequest:
      type: object
      required:
        - name
        - documentType
        - documentNo
        - contactPhone
        - contactEmail
      properties:
        name:
          type: string
          maxLength: 64
          example: 张小明
        documentType:
          type: string
          enum:
            - RESIDENT_ID_CARD
          example: RESIDENT_ID_CARD
        documentNo:
          type: string
          maxLength: 32
          description: 18 位居民身份证号，服务端校验并转大写。
          example: 11010519491231002X
        contactPhone:
          type: string
          maxLength: 32
          example: '13800138000'
        contactEmail:
          type: string
          format: email
          maxLength: 120
          example: patient@example.com
    PatientResult:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: success
        data:
          $ref: '#/components/schemas/Patient'
    PatientUpdateRequest:
      type: object
      description: 缺省或 null 的字段保留原值；提供的字段重新校验。
      properties:
        name:
          type: string
          maxLength: 64
        documentType:
          type: string
          enum:
            - RESIDENT_ID_CARD
        documentNo:
          type: string
          maxLength: 32
          description: 18 位居民身份证号。
        contactPhone:
          type: string
          maxLength: 32
        contactEmail:
          type: string
          format: email
          maxLength: 120
    PatientStatusRequest:
      type: object
      required:
        - enabled
      properties:
        enabled:
          type: boolean
          example: false
    Hospital:
      type: object
      required:
        - id
        - name
        - address
      properties:
        id:
          type: string
          example: '1'
        name:
          type: string
          example: 市中心医院
        address:
          type: string
          example: 人民路 100 号
    HospitalListResult:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: success
        data:
          type: array
          items:
            $ref: '#/components/schemas/Hospital'
    Department:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          example: '11'
        name:
          type: string
          example: 心内科
    DepartmentListResult:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: success
        data:
          type: array
          items:
            $ref: '#/components/schemas/Department'
    Doctor:
      type: object
      required:
        - id
        - doctorNo
        - name
        - title
        - introduction
      properties:
        id:
          type: string
          example: '101'
        doctorNo:
          type: string
          example: DOC000101
        name:
          type: string
          example: 李明
        title:
          type: string
          example: 主任医师
        introduction:
          type: string
          nullable: true
          example: 擅长心血管常见病诊治。
    DoctorListResult:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: success
        data:
          type: array
          items:
            $ref: '#/components/schemas/Doctor'
    LocalDate:
      type: string
      format: date
      description: 业务日期，格式 yyyy-MM-dd。
      example: '2026-11-14'
    LocalTime:
      type: string
      description: 时间，格式 HH:mm:ss。
      example: '08:00:00'
    MoneyString:
      type: string
      description: 金额字符串，保留两位小数。
      example: '10.00'
    Schedule:
      type: object
      description: 场次响应。单次查询返回今天、明天、后天共 12 项。
      required:
        - doctorId
        - doctorNo
        - appointmentDate
        - sessionType
        - startTime
        - endTime
        - totalCapacity
        - availableCapacity
        - registrationFee
        - feeCurrency
        - bookable
        - bookingClosesAt
        - availability
        - serverTime
      properties:
        doctorId:
          type: string
          example: '101'
        doctorNo:
          type: string
          example: DOC000101
        appointmentDate:
          $ref: '#/components/schemas/LocalDate'
        sessionType:
          type: string
          enum:
            - MORNING_FIRST
            - MORNING_SECOND
            - AFTERNOON_FIRST
            - AFTERNOON_SECOND
          example: MORNING_FIRST
        startTime:
          $ref: '#/components/schemas/LocalTime'
        endTime:
          $ref: '#/components/schemas/LocalTime'
        totalCapacity:
          type: integer
          example: 20
        availableCapacity:
          type: integer
          example: 20
        registrationFee:
          $ref: '#/components/schemas/MoneyString'
        feeCurrency:
          type: string
          enum:
            - CNY
          example: CNY
        bookable:
          type: boolean
          example: true
        bookingClosesAt:
          $ref: '#/components/schemas/LocalDateTime'
        availability:
          type: string
          enum:
            - AVAILABLE
            - FULL
            - STARTED
            - CUTOFF_REACHED
          example: AVAILABLE
        serverTime:
          $ref: '#/components/schemas/LocalDateTime'
    ScheduleListResult:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: success
        data:
          type: array
          items:
            $ref: '#/components/schemas/Schedule'
    CreateHospitalRequest:
      type: object
      required:
        - name
        - address
      properties:
        name:
          type: string
