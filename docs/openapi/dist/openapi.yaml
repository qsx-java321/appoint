        - hospitalId
        - hospitalName
        - departmentId
        - departmentName
        - doctorId
        - doctorNo
        - doctorName
        - userId
        - email
        - bindingStatus
        - passwordHint
      properties:
        hospitalId:
          type: string
          example: '1'
        hospitalName:
          type: string
          example: 市中心医院
        departmentId:
          type: string
          example: '11'
        departmentName:
          type: string
          example: 心内科
        doctorId:
          type: string
          example: '101'
        doctorNo:
          type: string
          example: DOC000101
        doctorName:
          type: string
          example: 李明
        userId:
          type: string
          nullable: true
          example: '12'
        email:
          type: string
          format: email
