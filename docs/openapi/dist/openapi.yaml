          example: false
        canPay:
          type: boolean
          example: false
        canCancel:
          type: boolean
          example: false
        patient:
          $ref: '#/components/schemas/AppointmentPatient'
        doctor:
          $ref: '#/components/schemas/AppointmentDoctor'
        sessionType:
          type: string
          enum:
            - MORNING_FIRST
            - MORNING_SECOND
            - AFTERNOON_FIRST
            - AFTERNOON_SECOND
          example: MORNING_FIRST
        visit:
          type: object
          nullable: true
          description: 已确认预约的就诊进度；未确认或用户取消后为 null。
