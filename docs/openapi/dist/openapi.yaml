    post:
      tags:
        - Appointment
      operationId: issueBookingToken
      summary: 领取预约令牌
      description: |
        为当前账号签发一次性预约令牌，有效期 600 秒。
        创建预约时把令牌放入 `Idempotency-Key` 请求头；网络重试沿用同一令牌和请求体。
      responses:
        '200':
          description: 预约令牌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingTokenResult'
              example:
                code: 0
                message: success
                data:
                  token: 6f8b7c1e-3f5d-4a8e-9b2c-1d4e6f8a0c2b
                  expiresIn: 600
        '401':
          $ref: '#/components/responses/Unauthorized'
  /appointments:
    post:
      tags:
        - Appointment
      operationId: createAppointment
      summary: 创建预约
      description: |
        首次成功返回 201；同一令牌、同一内容重放返回 200 和原回执；
        原请求仍在提交时返回 202。令牌绑定的内容与本次提交不同返回 409 / 4103；
        无效或过期且未创建预约的令牌返回 409 / 4104。
        日期须在业务今天至后天内，且早于场次开始前 15 分钟。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAppointmentRequest'
            example:
              doctorId: '1'
              appointmentDate: '2026-11-14'
              sessionType: MORNING_FIRST
              patientId: '201'
      responses:
        '200':
          description: 幂等重放，返回首次创建回执
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAppointmentResult'
              example:
                code: 0
                message: 该请求已创建预约，请查询详情获取当前状态
                data:
                  appointmentOrderId: '301'
                  appointmentNo: AP6f8b7c1e3f5d4a8e9b2c1d4e6f8a0c2b
                  appointmentStatus: PENDING_PAYMENT
                  paymentOrderId: '501'
                  paymentNo: PAY6f8b7c1e3f5d4a8e9b2c1d4e6f8a0c2b
                  paymentStatus: UNPAID
                  amount: '10.00'
                  currency: CNY
                  createdAt: '2026-11-14T09:00:00'
                  paymentExpiresAt: '2026-11-14T09:15:00'
                  serverTime: '2026-11-14T09:00:00'
        '201':
          description: 首次创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAppointmentResult'
              example:
                code: 0
                message: success
                data:
                  appointmentOrderId: '301'
                  appointmentNo: AP6f8b7c1e3f5d4a8e9b2c1d4e6f8a0c2b
                  appointmentStatus: PENDING_PAYMENT
                  paymentOrderId: '501'
                  paymentNo: PAY6f8b7c1e3f5d4a8e9b2c1d4e6f8a0c2b
                  paymentStatus: UNPAID
                  amount: '10.00'
                  currency: CNY
                  createdAt: '2026-11-14T09:00:00'
                  paymentExpiresAt: '2026-11-14T09:15:00'
                  serverTime: '2026-11-14T09:00:00'
        '202':
          description: 原请求仍在提交，继续使用原令牌和请求体重试
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingAppointmentResult'
              example:
                code: 0
                message: 原预约正在提交
                data:
                  pending: true
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 预约创建冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              examples:
                scheduleUnavailable:
                  value:
                    code: 4002
                    message: 该号源已不可预约
                    data: null
                cutoffReached:
                  value:
                    code: 4202
                    message: 已到预约截止时间
                    data: null
                duplicateActiveAppointment:
                  value:
                    code: 4204
                    message: 该就诊人已持有本场有效预约
                    data: null
                patientDisabled:
                  value:
                    code: 4102
                    message: 该就诊人已停用
                    data: null
                idempotencyConflict:
                  value:
                    code: 4103
                    message: 幂等键已用于其他预约请求
                    data: null
                tokenInvalid:
                  value:
                    code: 4104
                    message: 预约令牌无效或已过期，请重新提交
                    data: null
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/RetryableConcurrencyError'
