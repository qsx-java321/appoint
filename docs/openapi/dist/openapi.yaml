openapi: 3.0.3
info:
  title: 医院预约系统 API
  version: 1.0.0
  license:
    name: UNLICENSED
  description: |
    认证、用户、头像、就诊人和医疗目录接口的 OpenAPI 契约。

    通用约定、业务规则和错误码见 [REST API 文档](../api.md)。
    当前契约覆盖：

    - Auth：注册验证码、验码、注册、登录
    - User：当前用户、上传头像、删除头像、读取头像
    - Patient：就诊人列表、详情、新增、修改、启停
    - Catalog：医院、科室、医生、场次查询
    - AdminCatalog：医院、科室、医生档案管理
    - BookingSettings：统一预约设置
    - DoctorAccount：医生账号查询与首次绑定

    本地环境通过 `X-Appoint-Environment` 标识 demo/dev/test；直接调用后端时可省略。
    业务 API 使用统一响应结构 `{ code, message, data }`，错误时 `data=null`。
servers:
  - url: http://127.0.0.1:8080/api/v1
    description: 本地后端（demo/dev/test 共用 8080，按启动的 profile 切换）
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: 注册与登录
  - name: User
    description: 当前用户与头像
  - name: Patient
    description: 就诊人管理
  - name: Catalog
    description: 登录用户查询医院、科室、医生和场次
  - name: AdminCatalog
    description: 管理员维护医院、科室和医生档案
  - name: BookingSettings
    description: 管理员统一预约设置
  - name: DoctorAccount
    description: 管理员查询和首次绑定医生账号
paths:
  /auth/register/code:
    post:
      tags:
        - Auth
      operationId: sendRegistrationCode
      summary: 发送注册验证码
      description: |
        向指定邮箱发送六位数字验证码，验证码写入 Redis 并通过 Mailpit 投递。
        邮箱已注册时返回 409 / 3001；验证码默认有效期五分钟，重发覆盖旧码。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendRegistrationCodeRequest'
            example:
              email: new-user@example.local
      responses:
        '200':
          description: 验证码已发送
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationCodeResult'
              example:
                code: 0
                message: success
                data:
                  expiresIn: 300
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/EmailExists'
  /auth/register/verify:
    post:
      tags:
        - Auth
      operationId: verifyRegistrationCode
      summary: 校验注册验证码
      description: |
        校验验证码并签发一次性注册票据。验证码错误返回 400 / 3003；
        验证码不存在或已过期返回 400 / 3004。验码成功后旧验证码被消费。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRegistrationCodeRequest'
            example:
              email: new-user@example.local
              code: '012345'
      responses:
        '200':
          description: 验证码正确，返回注册票据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupTicketResult'
              example:
                code: 0
                message: success
                data:
                  signupTicket: 6f8b7c1e-3f5d-4a8e-9b2c-1d4e6f8a0c2b
                  expiresIn: 300
        '400':
          description: 验证码错误或已过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              examples:
                invalid:
                  value:
                    code: 3003
                    message: 验证码错误
                    data: null
                expired:
                  value:
                    code: 3004
                    message: 验证码已过期，请重新获取
                    data: null
                validation:
                  value:
                    code: 1001
                    message: 请求参数不合法
                    data: null
  /auth/register:
    post:
      tags:
        - Auth
      operationId: register
      summary: 注册账号
      description: |
        消费一次性注册票据并创建普通用户账号，初始角色为 USER。
        注册票据无效、过期、已消费或邮箱不匹配返回 400 / 3005；邮箱已注册返回 409 / 3001。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: new-user@example.local
              password: <PASSWORD>
              signupTicket: 6f8b7c1e-3f5d-4a8e-9b2c-1d4e6f8a0c2b
      responses:
        '201':
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResult'
              example:
                code: 0
                message: success
                data:
                  id: '2'
                  email: new-user@example.local
                  roles:
                    - USER
                  avatarUrl: null
        '400':
          description: 注册票据无效或请求参数不合法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              examples:
                ticketInvalid:
                  value:
                    code: 3005
                    message: 注册凭证无效，请重新验证邮箱
                    data: null
                validation:
                  value:
                    code: 1001
                    message: 请求参数不合法
                    data: null
        '409':
          $ref: '#/components/responses/EmailExists'
  /auth/login:
    post:
      tags:
        - Auth
      operationId: login
      summary: 登录
      description: |
        使用邮箱和密码登录，返回 JWT 与当前用户信息。
        后续请求使用 `Authorization: Bearer <accessToken>`；角色变更后需重新登录。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: demo-user@example.local
              password: <LOCAL_SEED_PASSWORD>
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
              example:
                code: 0
                message: success
                data:
                  accessToken: <JWT>
                  tokenType: Bearer
                  expiresIn: 7200
                  user:
                    id: '1'
                    email: demo-user@example.local
                    roles:
                      - USER
                    avatarUrl: null
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/LoginFailed'
  /users/me:
    get:
      tags:
        - User
      operationId: getCurrentUser
      summary: 查询当前用户
      description: 返回当前登录用户的基本信息、角色和头像地址。
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResult'
              example:
                code: 0
                message: success
                data:
                  id: '1'
                  email: demo-user@example.local
                  roles:
                    - USER
                  avatarUrl: /api/v1/users/1/avatar?v=0ffcbffe-d6d1-4f4c-aa86-9faf4acc911e.png
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/me/avatar:
    put:
      tags:
        - User
      operationId: uploadAvatar
      summary: 上传或替换当前头像
      description: |
        只操作当前登录账号。服务端按文件头判定 JPEG/PNG/WebP，并校验大小不超过 2 MB、
        JPEG/PNG 宽高不超过 4096 像素。成功后返回新的 `avatarUrl`，替换头像会生成新的版本号。
        数据库更新失败时删除新写入的对象；旧对象在更新成功后尽力删除。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AvatarUploadRequest'
      responses:
        '200':
          description: 头像已更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResult'
              example:
                code: 0
                message: success
                data:
                  id: '1'
                  email: demo-user@example.local
                  roles:
                    - USER
                  avatarUrl: /api/v1/users/1/avatar?v=8d9c1a2b-4e6f-4a1b-9c3d-2f5e7a9b1c3d.png
        '400':
          description: 头像格式、大小、尺寸或 multipart 参数不合法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              examples:
                avatarInvalid:
                  value:
                    code: 3101
                    message: 头像必须是 2 MB 以内的 JPEG、PNG 或 WebP 图片
                    data: null
                validation:
                  value:
                    code: 1001
                    message: 请求参数不合法
                    data: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/AvatarStorageUnavailable'
    delete:
      tags:
        - User
      operationId: deleteAvatar
      summary: 删除当前头像
      description: 清空当前头像并尽力删除对象存储中的旧对象。重复删除仍返回 200，`avatarUrl` 保持 null。
      responses:
        '200':
          description: 头像已删除
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResult'
              example:
                code: 0
                message: success
                data:
                  id: '1'
                  email: demo-user@example.local
                  roles:
                    - USER
                  avatarUrl: null
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/{id}/avatar:
    get:
      tags:
        - User
      operationId: getUserAvatar
      summary: 读取用户头像图片
      description: |
        按用户 ID 返回当前头像图片，无需登录。响应带长期缓存头和 ETag；
        `If-None-Match` 匹配时返回 304。用户没有头像、头像已删除或对象不存在时返回 404。
      security: []
      parameters:
        - name: id
          in: path
          required: true
          description: 用户 ID。
          schema:
            type: integer
            format: int64
            example: 1
        - name: v
          in: query
          required: false
          description: 缓存版本号，通常为头像对象文件名。替换头像后变化。
          schema:
            type: string
            example: 0ffcbffe-d6d1-4f4c-aa86-9faf4acc911e.png
        - name: If-None-Match
          in: header
          required: false
          description: 浏览器缓存校验值，与 ETag 匹配时返回 304。
          schema:
            type: string
            example: '"0ffcbffe-d6d1-4f4c-aa86-9faf4acc911e.png"'
      responses:
        '200':
          description: 头像图片
          headers:
            ETag:
              description: 当前头像版本，值为对象文件名。
              schema:
                type: string
                example: '"0ffcbffe-d6d1-4f4c-aa86-9faf4acc911e.png"'
            Cache-Control:
              description: 长期公共缓存。
              schema:
                type: string
                example: max-age=31536000, public, immutable
            X-Content-Type-Options:
              description: 防止浏览器嗅探内容类型。
              schema:
                type: string
                example: nosniff
          content:
            image/png:
              schema:
                $ref: '#/components/schemas/AvatarImage'
            image/jpeg:
              schema:
                $ref: '#/components/schemas/AvatarImage'
            image/webp:
              schema:
                $ref: '#/components/schemas/AvatarImage'
        '304':
          description: 头像未变化
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/AvatarStorageUnavailable'
  /patients:
    post:
      tags:
        - Patient
      operationId: createPatient
      summary: 新增就诊人
      description: |
        为当前登录账号新增就诊人，初始 `enabled=true`。
        证件类型目前只支持 `RESIDENT_ID_CARD`，证件号会去除首尾空白并转大写后校验。
        同一账号下相同证件重复登记返回 409 / 4101。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientCreateRequest'
            example:
              name: 张小明
              documentType: RESIDENT_ID_CARD
              documentNo: 11010519491231002X
              contactPhone: '13800138000'
              contactEmail: patient@example.com
      responses:
        '201':
          description: 就诊人已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientResult'
              example:
                code: 0
                message: success
                data:
                  id: '201'
                  name: 张小明
                  documentType: RESIDENT_ID_CARD
                  documentNoMasked: 1101**********002X
                  contactPhone: '13800138000'
                  contactEmail: patient@example.com
                  enabled: true
                  createdAt: '2026-11-14T09:00:00'
                  updatedAt: '2026-11-14T09:00:00'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/PatientDocumentExists'
    get:
      tags:
        - Patient
      operationId: listPatients
      summary: 查询本人就诊人
      description: 只返回当前登录账号的就诊人；没有数据时返回空数组。
      responses:
        '200':
          description: 当前账号的就诊人列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientListResult'
              example:
                code: 0
                message: success
                data:
                  - id: '201'
                    name: 张小明
                    documentType: RESIDENT_ID_CARD
                    documentNoMasked: 1101**********002X
                    contactPhone: '13800138000'
                    contactEmail: patient@example.com
                    enabled: true
                    createdAt: '2026-11-14T09:00:00'
                    updatedAt: '2026-11-14T09:00:00'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /patients/{id}:
    parameters:
      - $ref: '#/components/parameters/PatientId'
    get:
      tags:
        - Patient
      operationId: getPatient
      summary: 查询本人就诊人
      description: 只能读取当前账号下的就诊人；其他账号的就诊人返回 403 / 2002。
      responses:
        '200':
          description: 就诊人详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientResult'
              example:
                code: 0
                message: success
                data:
                  id: '201'
                  name: 张小明
                  documentType: RESIDENT_ID_CARD
                  documentNoMasked: 1101**********002X
                  contactPhone: '13800138000'
                  contactEmail: patient@example.com
                  enabled: true
                  createdAt: '2026-11-14T09:00:00'
                  updatedAt: '2026-11-14T09:00:00'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Patient
      operationId: updatePatient
      summary: 修改本人就诊人
      description: |
        缺省或 null 的字段保留原值；提供的字段重新校验。
        证件号变更后仍需满足 18 位居民身份证校验；同账号重复证件返回 409 / 4101。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientUpdateRequest'
            example:
              contactPhone: '13900139000'
      responses:
        '200':
          description: 更新后的就诊人
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientResult'
              example:
                code: 0
                message: success
                data:
                  id: '201'
                  name: 张小明
                  documentType: RESIDENT_ID_CARD
                  documentNoMasked: 1101**********002X
                  contactPhone: '13900139000'
                  contactEmail: patient@example.com
                  enabled: true
                  createdAt: '2026-11-14T09:00:00'
                  updatedAt: '2026-11-14T10:00:00'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/PatientDocumentExists'
  /patients/{id}/status:
    parameters:
      - $ref: '#/components/parameters/PatientId'
    patch:
      tags:
        - Patient
      operationId: updatePatientStatus
      summary: 启用或停用本人就诊人
      description: 停用只影响后续下单，已创建预约保留原快照；重复设置相同状态仍返回当前资料。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientStatusRequest'
            example:
              enabled: false
      responses:
        '200':
          description: 更新后的就诊人
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientResult'
              example:
                code: 0
                message: success
                data:
                  id: '201'
                  name: 张小明
                  documentType: RESIDENT_ID_CARD
                  documentNoMasked: 1101**********002X
                  contactPhone: '13900139000'
                  contactEmail: patient@example.com
                  enabled: false
                  createdAt: '2026-11-14T09:00:00'
                  updatedAt: '2026-11-14T10:05:00'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /hospitals:
    get:
      tags:
        - Catalog
      operationId: listHospitals
      summary: 查询医院列表
      description: 返回当前环境的全部医院。未登录返回 401。
      responses:
        '200':
          description: 医院列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HospitalListResult'
              example:
                code: 0
                message: success
                data:
                  - id: '1'
                    name: 市中心医院
                    address: 人民路 100 号
                  - id: '2'
                    name: 新区医院
                    address: 健康路 88 号
        '401':
          $ref: '#/components/responses/Unauthorized'
  /hospitals/{hospitalId}/departments:
    parameters:
      - $ref: '#/components/parameters/HospitalId'
    get:
      tags:
        - Catalog
      operationId: listDepartments
      summary: 查询医院科室
      description: 父级医院不存在或没有科室时返回空数组，不返回 404。
      responses:
        '200':
          description: 科室列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentListResult'
              example:
                code: 0
                message: success
                data:
                  - id: '11'
                    name: 心内科
                  - id: '12'
                    name: 神经内科
        '401':
          $ref: '#/components/responses/Unauthorized'
  /departments/{departmentId}/doctors:
    parameters:
      - $ref: '#/components/parameters/DepartmentId'
    get:
      tags:
        - Catalog
      operationId: listDoctors
      summary: 查询科室医生
      description: 父级科室不存在或没有医生时返回空数组，不返回 404。
      responses:
        '200':
          description: 医生列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorListResult'
              example:
                code: 0
                message: success
                data:
                  - id: '101'
                    doctorNo: DOC000101
                    name: 李明
                    title: 主任医师
                    introduction: 擅长心血管常见病诊治。
        '401':
          $ref: '#/components/responses/Unauthorized'
  /doctors/{doctorId}/schedules:
    parameters:
      - $ref: '#/components/parameters/DoctorId'
    get:
      tags:
        - Catalog
      operationId: listSchedules
      summary: 查询医生场次
      description: |
        返回业务今天、明天、后天共 12 个场次，按日期和固定时段排列。
        医生不存在时返回空数组。`availability` 按 `STARTED`、`CUTOFF_REACHED`、`FULL`、`AVAILABLE`
        的顺序判定；`bookable` 仅在 `AVAILABLE` 时为真。同一响应 12 个场次共享 `serverTime`。
      responses:
        '200':
          description: 场次列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleListResult'
              example:
                code: 0
                message: success
                data:
                  - doctorId: '101'
                    doctorNo: DOC000101
                    appointmentDate: '2026-11-14'
                    sessionType: MORNING_FIRST
                    startTime: '08:00:00'
                    endTime: '10:00:00'
                    totalCapacity: 20
                    availableCapacity: 18
                    registrationFee: '10.00'
                    feeCurrency: CNY
                    bookable: true
                    bookingClosesAt: '2026-11-14T07:45:00'
                    availability: AVAILABLE
                    serverTime: '2026-11-14T07:30:00'
                  - doctorId: '101'
                    doctorNo: DOC000101
                    appointmentDate: '2026-11-14'
                    sessionType: MORNING_SECOND
                    startTime: '10:30:00'
                    endTime: '12:00:00'
                    totalCapacity: 20
                    availableCapacity: 20
                    registrationFee: '10.00'
                    feeCurrency: CNY
                    bookable: true
                    bookingClosesAt: '2026-11-14T10:15:00'
                    availability: AVAILABLE
                    serverTime: '2026-11-14T07:30:00'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/hospitals:
    post:
      tags:
        - AdminCatalog
      operationId: createHospital
      summary: 新增医院
