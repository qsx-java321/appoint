                  updatedAt: '2026-11-14T10:00:00'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/doctor-accounts:
    get:
      tags:
        - DoctorAccount
      operationId: listDoctorAccounts
      summary: 查询医生账号绑定情况
      description: |
        需要 ADMIN 角色。返回当前后端所连接环境的全部医生及实际账号绑定，按医院、科室、医生编号排序。
        未绑定账号的医生也会返回；`passwordHint` 只说明密码来源，不包含密码或哈希。
      responses:
        '200':
          description: 医生账号绑定列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorAccountListResult'
              example:
                code: 0
                message: success
                data:
                  environment: test
                  items:
                    - hospitalId: '1'
                      hospitalName: 市中心医院
                      departmentId: '11'
                      departmentName: 心内科
                      doctorId: '101'
                      doctorNo: DOC000101
                      doctorName: 李明
                      userId: '12'
                      email: test-doctor-001@example.local
                      bindingStatus: BOUND
                      passwordHint: 初始密码见 .env.test 的 LOCAL_SEED_PASSWORD
                    - hospitalId: '1'
                      hospitalName: 市中心医院
                      departmentId: '11'
                      departmentName: 心内科
                      doctorId: '102'
                      doctorNo: DOC000102
                      doctorName: 王芳
                      userId: null
                      email: null
                      bindingStatus: UNBOUND
                      passwordHint: 未绑定账号
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/doctors/{doctorId}/account:
    parameters:
      - $ref: '#/components/parameters/DoctorId'
    put:
      tags:
        - DoctorAccount
      operationId: bindDoctorAccount
      summary: 首次绑定医生账号
      description: |
        需要 ADMIN 角色。首次绑定同时授予账号 DOCTOR 角色，账号重新登录后可使用医生接口。
        医生档案或账号已有绑定时返回 409 / 4501，包括对同一关系的重复绑定；当前接口不支持换绑。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BindDoctorAccountRequest'
            example:
              userId: '12'
      responses:
        '200':
          description: 绑定成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorAccountBindingResult'
              example:
                code: 0
                message: success
                data:
                  doctorId: '101'
                  userId: '12'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/DoctorAccountAlreadyBound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: '登录接口返回的 accessToken，放在 `Authorization: Bearer <token>`。'
  schemas:
    SendRegistrationCodeRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: new-user@example.local
    RegistrationCodeResult:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: success
        data:
          type: object
          required:
            - expiresIn
          properties:
            expiresIn:
              type: integer
              description: 验证码有效期，单位秒。
              example: 300
    ErrorResult:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          type: integer
          description: 业务错误码，非 0。
          example: 3101
        message:
          type: string
          example: 头像必须是 2 MB 以内的 JPEG、PNG 或 WebP 图片
        data:
          type: object
          nullable: true
          example: null
    VerifyRegistrationCodeRequest:
      type: object
      required:
        - email
        - code
      properties:
        email:
          type: string
          format: email
          example: new-user@example.local
        code:
          type: string
          description: 六位数字验证码，保留前导零。
          pattern: ^[0-9]{6}$
          example: '012345'
    SignupTicketResult:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: success
        data:
          type: object
          required:
            - signupTicket
            - expiresIn
          properties:
            signupTicket:
              type: string
              description: 一次性注册票据，提交注册时消费。
              example: 6f8b7c1e-3f5d-4a8e-9b2c-1d4e6f8a0c2b
            expiresIn:
              type: integer
              example: 300
    RegisterRequest:
      type: object
      required:
        - email
        - password
        - signupTicket
      properties:
        email:
          type: string
          format: email
          example: new-user@example.local
        password:
          type: string
          minLength: 8
          maxLength: 64
          example: <PASSWORD>
        signupTicket:
          type: string
          example: 6f8b7c1e-3f5d-4a8e-9b2c-1d4e6f8a0c2b
    User:
      type: object
      description: 当前登录用户或注册用户。
      required:
        - id
        - email
        - roles
        - avatarUrl
      properties:
        id:
          type: string
          description: 用户 ID。服务端 Long 统一序列化为字符串，避免前端精度丢失。
          example: '1'
        email:
          type: string
          format: email
          example: demo-user@example.local
        roles:
          type: array
          description: 当前数据库角色码。
          items:
            type: string
            enum:
              - USER
              - DOCTOR
              - ADMIN
          example:
            - USER
        avatarUrl:
          type: string
          nullable: true
          description: 当前头像相对地址；无头像时为 null。替换头像后版本号会变化。
          example: /api/v1/users/1/avatar?v=0ffcbffe-d6d1-4f4c-aa86-9faf4acc911e.png
    UserResult:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: success
        data:
          $ref: '#/components/schemas/User'
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: demo-user@example.local
        password:
          type: string
          minLength: 8
          maxLength: 64
          example: <LOCAL_SEED_PASSWORD>
    LoginResult:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: success
        data:
          type: object
          required:
            - accessToken
            - tokenType
            - expiresIn
            - user
          properties:
            accessToken:
              type: string
              example: <JWT>
            tokenType:
              type: string
              enum:
                - Bearer
              example: Bearer
            expiresIn:
              type: integer
              description: Token 有效期，单位秒。
              example: 7200
            user:
              $ref: '#/components/schemas/User'
    AvatarUploadRequest:
      type: object
      required:
        - file
      properties:
        file:
          type: string
          format: binary
          description: JPEG、PNG 或 WebP 图片，不超过 2 MB。服务端按文件头判定格式。
    AvatarImage:
      type: string
      format: binary
      description: 头像图片字节。
    LocalDateTime:
      type: string
      description: 业务本地时间，Asia/Shanghai，格式 yyyy-MM-ddTHH:mm:ss，不带时区偏移。
      example: '2026-11-14T09:00:00'
    Patient:
      type: object
      description: 就诊人资料。证件号只返回脱敏值。
      required:
        - id
        - name
        - documentType
        - documentNoMasked
        - contactPhone
        - contactEmail
        - enabled
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          example: '201'
        name:
          type: string
          maxLength: 64
          example: 张小明
        documentType:
          type: string
          enum:
            - RESIDENT_ID_CARD
          example: RESIDENT_ID_CARD
        documentNoMasked:
          type: string
          description: 脱敏证件号，不返回原文。
          example: 1101**********002X
        contactPhone:
          type: string
          example: '13800138000'
        contactEmail:
          type: string
          format: email
          example: patient@example.com
        enabled:
          type: boolean
          example: true
        createdAt:
          $ref: '#/components/schemas/LocalDateTime'
        updatedAt:
          $ref: '#/components/schemas/LocalDateTime'
    PatientListResult:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: success
        data:
          type: array
          items:
            $ref: '#/components/schemas/Patient'
    PatientCreateRequest:
      type: object
      required:
        - name
        - documentType
        - documentNo
        - contactPhone
        - contactEmail
      properties:
        name:
          type: string
          maxLength: 64
          example: 张小明
        documentType:
          type: string
          enum:
            - RESIDENT_ID_CARD
          example: RESIDENT_ID_CARD
        documentNo:
          type: string
          maxLength: 32
          description: 18 位居民身份证号，服务端校验并转大写。
          example: 11010519491231002X
        contactPhone:
          type: string
          maxLength: 32
          example: '13800138000'
        contactEmail:
          type: string
          format: email
          maxLength: 120
          example: patient@example.com
    PatientResult:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: success
        data:
          $ref: '#/components/schemas/Patient'
    PatientUpdateRequest:
      type: object
      description: 缺省或 null 的字段保留原值；提供的字段重新校验。
      properties:
        name:
          type: string
          maxLength: 64
        documentType:
          type: string
          enum:
            - RESIDENT_ID_CARD
        documentNo:
          type: string
          maxLength: 32
          description: 18 位居民身份证号。
        contactPhone:
          type: string
          maxLength: 32
        contactEmail:
          type: string
          format: email
          maxLength: 120
    PatientStatusRequest:
      type: object
      required:
        - enabled
      properties:
        enabled:
          type: boolean
          example: false
    Hospital:
      type: object
      required:
        - id
        - name
        - address
      properties:
        id:
          type: string
          example: '1'
        name:
          type: string
          example: 市中心医院
        address:
          type: string
          example: 人民路 100 号
    HospitalListResult:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: success
        data:
          type: array
          items:
            $ref: '#/components/schemas/Hospital'
    Department:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          example: '11'
        name:
          type: string
          example: 心内科
    DepartmentListResult:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          type: integer
          example: 0
        message:
