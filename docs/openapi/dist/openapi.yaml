      example: '08:00:00'
    MoneyString:
      type: string
      description: 金额字符串，保留两位小数。
      example: '10.00'
    Schedule:
      type: object
      description: 场次响应。单次查询返回今天、明天、后天共 12 项。
      required:
        - doctorId
        - doctorNo
        - appointmentDate
        - sessionType
        - startTime
        - endTime
        - totalCapacity
        - availableCapacity
        - registrationFee
        - feeCurrency
        - bookable
        - bookingClosesAt
        - availability
        - serverTime
      properties:
        doctorId:
          type: string
          example: '101'
        doctorNo:
          type: string
          example: DOC000101
        appointmentDate:
          $ref: '#/components/schemas/LocalDate'
        sessionType:
          type: string
          enum:
            - MORNING_FIRST
            - MORNING_SECOND
            - AFTERNOON_FIRST
            - AFTERNOON_SECOND
          example: MORNING_FIRST
        startTime:
          $ref: '#/components/schemas/LocalTime'
        endTime:
          $ref: '#/components/schemas/LocalTime'
        totalCapacity:
          type: integer
          example: 20
        availableCapacity:
          type: integer
          example: 20
        registrationFee:
          $ref: '#/components/schemas/MoneyString'
        feeCurrency:
          type: string
          enum:
            - CNY
          example: CNY
        bookable:
          type: boolean
          example: true
        bookingClosesAt:
          $ref: '#/components/schemas/LocalDateTime'
        availability:
          type: string
          enum:
            - AVAILABLE
            - FULL
            - STARTED
            - CUTOFF_REACHED
          example: AVAILABLE
        serverTime:
          $ref: '#/components/schemas/LocalDateTime'
    ScheduleListResult:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: success
        data:
          type: array
          items:
