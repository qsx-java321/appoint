          type: string
          example: '501'
        paymentNo:
          type: string
          example: PAY6f8b7c1e3f5d4a8e9b2c1d4e6f8a0c2b
        paymentStatus:
          type: string
          enum:
            - UNPAID
          example: UNPAID
        amount:
          $ref: '#/components/schemas/MoneyString'
        currency:
          type: string
          enum:
            - CNY
          example: CNY
        createdAt:
          $ref: '#/components/schemas/LocalDateTime'
        paymentExpiresAt:
          $ref: '#/components/schemas/LocalDateTime'
        serverTime:
          $ref: '#/components/schemas/LocalDateTime'
    CreateAppointmentResult:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: success
        data:
          $ref: '#/components/schemas/CreateAppointmentResponse'
    PendingAppointment:
      type: object
      required:
        - pending
      properties:
        pending:
          type: boolean
          example: true
    PendingAppointmentResult:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: 原预约正在提交
        data:
          $ref: '#/components/schemas/PendingAppointment'
    NullableLocalDateTime:
