name: appoint

services:
  mailpit:
    image: axllent/mailpit:v1.31
    container_name: appoint-mailpit
    environment:
      MP_DATABASE: /data/mailpit.db
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    volumes:
      - appoint-mailpit-data:/data
    networks:
      - appoint-network
    restart: "no"

  mysql:
    image: mysql:8.4
    container_name: appoint-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - appoint-mysql-data:/var/lib/mysql
    networks:
      - appoint-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: "no"

  redis:
    image: redis:7.4.9
    container_name: appoint-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - appoint-redis-data:/data
    networks:
      - appoint-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: "no"

  seaweedfs:
    image: chrislusf/seaweedfs:4.39
    container_name: appoint-seaweedfs
    environment:
      AWS_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY:-appoint}
      AWS_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_KEY:-appoint-local}
      S3_BUCKET: appoint-avatars-demo,appoint-avatars-dev,appoint-avatars-test
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - appoint-seaweedfs-data:/data
    networks:
      - appoint-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9333/cluster/status >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: "no"

  rabbitmq:
    image: rabbitmq:4.3.2-management
    container_name: appoint-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      TZ: Asia/Shanghai
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - appoint-rabbitmq-data:/var/lib/rabbitmq
    networks:
      - appoint-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: "no"

volumes:
  appoint-mysql-data:
  appoint-redis-data:
  appoint-rabbitmq-data:
  appoint-mailpit-data:
  appoint-seaweedfs-data:

networks:
  appoint-network:
    name: appoint-network

