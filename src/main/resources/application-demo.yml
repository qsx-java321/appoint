spring:
  config:
    import: file:./.env.demo[.properties]
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/appoint_demo?serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: /appoint-demo
appoint:
  registration:
    namespace: demo
  local-environment:
    enabled: true
    name: demo
    seed-password: ${LOCAL_SEED_PASSWORD:}
  catalog-cache:
    enabled: true
    namespace: demo
  jwt:
    secret: ${JWT_SECRET}
