spring:
  config:
    import: file:./.env.dev[.properties]
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/appoint?serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: /appoint-dev
appoint:
  registration:
    namespace: dev
  local-environment:
    enabled: true
    name: dev
    seed-password: ${LOCAL_SEED_PASSWORD:}
  catalog-cache:
    enabled: true
    namespace: dev
  jwt:
    secret: ${JWT_SECRET}
  mock-pay:
    signing-key: ${MOCK_PAY_SIGNING_KEY}
