server:
  port: 8080
  error:
    include-message: never

spring:
  profiles:
    default: dev
  application:
    name: appoint
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/appoint?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USER:appoint}
    password: ${MYSQL_PASSWORD:appoint@123}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Shanghai
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 500ms
      timeout: 200ms
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

appoint:
  catalog-cache:
    enabled: false
    namespace: ${CATALOG_CACHE_NAMESPACE:}
    hospital-ttl: 5m
    department-ttl: 5m
    doctor-ttl: 2m
    empty-ttl: 30s
  messaging:
    enabled: true
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-local-development-secret-key-1234567890}
    expiration-seconds: 7200
  appointment:
    payment-timeout: 15m
  expiration:
    enabled: true
    scan-delay: 30s
    batch-size: 100
  reconciliation:
    enabled: true
    scan-delay: 5m
    stale-after: 5m
    batch-size: 100
  outbox:
    enabled: true
    scan-delay: 5s
    batch-size: 50
    max-attempts: 8
    initial-backoff: 1s
    max-backoff: 5m
    confirm-timeout: 5s

logging:
  level:
    com.qsx.appoint: INFO

