server:
  address: 127.0.0.1
  port: 8080
  error:
    include-message: never

spring:
  mail:
    host: 127.0.0.1
    port: 1025
    default-encoding: UTF-8
    properties:
      "[mail.smtp.auth]": false
      "[mail.smtp.starttls.enable]": false
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 3000
      "[mail.smtp.writetimeout]": 5000
  profiles:
    default: demo
  application:
    name: appoint
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/appoint?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USER:appoint}
    password: ${MYSQL_PASSWORD:appoint@123}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 4MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 500ms
      timeout: 200ms
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        concurrency: 1
        max-concurrency: 1

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

appoint:
  catalog-cache:
    enabled: false
    namespace: ${CATALOG_CACHE_NAMESPACE:}
    hospital-ttl: 5m
    department-ttl: 5m
    doctor-ttl: 2m
    empty-ttl: 30s
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-local-development-secret-key-1234567890}
    expiration-seconds: 7200
  avatar:
    endpoint: ${SEAWEEDFS_ENDPOINT:http://127.0.0.1:8333}
    region: ${SEAWEEDFS_REGION:us-east-1}
    access-key: ${SEAWEEDFS_ACCESS_KEY:appoint}
    secret-key: ${SEAWEEDFS_SECRET_KEY:appoint-local}
    bucket: ${SEAWEEDFS_BUCKET:appoint-avatars-demo}
    max-bytes: 2097152
    max-dimension: 4096
  appointment:
    payment-timeout: 15m
  notification:
    messaging-enabled: true
  expiration:
    enabled: true
    scan-delay: 30s
    batch-size: 100
logging:
  level:
    com.qsx.appoint: INFO

