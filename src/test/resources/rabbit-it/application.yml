spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Shanghai
  data:
    redis:
      connect-timeout: 500ms
      timeout: 200ms
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        concurrency: 1
        max-concurrency: 1

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

appoint:
  registration:
    namespace: rabbit-it
  jwt:
    secret: rabbit-integration-only-secret-at-least-thirty-two-characters-12345
    expiration-seconds: 7200
  appointment:
    payment-timeout: 15m
  notification:
    messaging-enabled: true
    publish-delay: 1s
  catalog-cache:
    enabled: false
  expiration:
    enabled: false
  local-environment:
    enabled: false
    name: rabbit-it
