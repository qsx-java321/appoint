spring:
  datasource:
    url: jdbc:h2:mem:appoint;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
  jackson:
    time-zone: Asia/Shanghai

appoint:
  messaging:
    enabled: false
  jwt:
    secret: test-secret-key-must-be-at-least-thirty-two-characters-long-12345
    expiration-seconds: 7200
  appointment:
    payment-timeout: 15m
  expiration:
    enabled: false
    scan-delay: 30s
    batch-size: 100
  reconciliation:
    enabled: false
  outbox:
    enabled: false
