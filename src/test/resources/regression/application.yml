spring:
  data:
    redis:
      connect-timeout: 500ms
      timeout: 200ms
  datasource:
    url: jdbc:h2:mem:appoint;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
  jackson:
    time-zone: Asia/Shanghai

appoint:
  registration:
    namespace: regression
  catalog-cache:
    enabled: false
  jwt:
    secret: test-secret-key-must-be-at-least-thirty-two-characters-long-12345
    expiration-seconds: 7200
  appointment:
    payment-timeout: 15m
  avatar:
    endpoint: http://127.0.0.1:8333
    region: us-east-1
    access-key: test
    secret-key: test
    bucket: appoint-avatars-test
    max-bytes: 2097152
    max-dimension: 4096
  notification:
    messaging-enabled: false
  expiration:
    enabled: false
    scan-delay: 30s
    batch-size: 100

  local-environment:
    enabled: false
